name: CI

on:
  push:
    branches: [master, main]
    paths: ["w5/pg-mcp/**"]
  pull_request:
    paths: ["w5/pg-mcp/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: w5/pg-mcp

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Ruff check
        run: uv run ruff check src tests

  unit-tests:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run unit tests with coverage
        run: uv run pytest tests/unit -q --cov=src --cov-report=term --cov-report=xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: w5/pg-mcp/coverage.xml

  security-tests:
    name: Security tests (sql validator suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --extra dev
      # 核心安全模块必须独立成组并通过（CLAUDE.md: 核心安全模块 >= 95% 分支覆盖要求）
      - name: Run security-focused unit tests
        run: |
          uv run pytest tests/unit/test_sql_validator.py tests/unit/test_sql_executor.py -q
          uv run pytest tests/unit/test_orchestrator.py::TestSecurityPolicyWiring -q

  integration-tests:
    name: Integration tests (PostgreSQL service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OBSERVABILITY_METRICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Load fixtures
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE blog_small;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d blog_small -f fixtures/01_small_db.sql
      # 需要真实 LLM 的用例在无 API key 的 fork PR 上自动跳过（测试内部按环境变量跳过）
      - name: Run integration tests
        if: env.OPENAI_API_KEY != ''
        run: uv run pytest tests/integration -q -m integration
